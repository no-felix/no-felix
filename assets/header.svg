<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
<defs>
  <clipPath id="card"><rect x="0.5" y="0.5" width="1199" height="359" rx="20"/></clipPath>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f97316"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c4b5fd"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/></pattern>
  <radialGradient id="fade" cx="0.78" cy="0.45" r="0.6"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="dotmask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="360" fill="#0b0b10"/>
  
  <rect width="1200" height="360" fill="url(#dots)" mask="url(#dotmask)"/>
  <g filter="url(#blur)">
    <ellipse cx="1020" cy="70" rx="240" ry="150" fill="#a855f7" fill-opacity="0.22"/>
    <ellipse cx="1100" cy="320" rx="220" ry="120" fill="#f97316" fill-opacity="0.15"/>
    <ellipse cx="720" cy="360" rx="180" ry="100" fill="#22d3ee" fill-opacity="0.08"/>
  </g>

  <g transform="translate(64 0)">
    <text x="0" y="66" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a1a1aa">@no-felix</text>
    <text x="-3" y="158" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="600" letter-spacing="-2.5" fill="url(#name)" textLength="138.1" lengthAdjust="spacing">Felix</text>
    <circle cx="148.1" cy="153" r="5" fill="#f97316"/>
    <rect x="0" y="177" width="42" height="2" rx="1" fill="#a855f7"/>
    <text x="0" y="222" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" fill="#d4d4d8">System Integration Specialist</text>
    <text x="0" y="258" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#a1a1aa">Backend, infrastructure and automation.</text>
    <text x="0" y="310" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#a1a1aa">Based in Germany</text>
  </g>
  <rect x="670" y="58" width="1" height="244" fill="#ffffff" opacity="0.06"/>
  <text x="744" y="88" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.9" fill="#a1a1aa">RUST / GAME DEVELOPMENT</text>
  <image href="data:image/svg+xml;base64," x="702" y="100" width="448" height="146" preserveAspectRatio="xMidYMid meet"/>
  <text x="744" y="270" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#a1a1aa">OMSI 2 reimplemented in Rust.</text>
  <rect y="358" width="1200" height="2" fill="url(#accent)" opacity="0.55"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="359" rx="20" stroke="#1f1f29"/>
</svg>
