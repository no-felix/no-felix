<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Profile views: 1,015</title>
  <desc id="description">Daily snapshot of Komarev image requests, not unique visitors. Includes counter refresh requests.</desc>
  <defs>
    <clipPath id="card"><rect x="0.5" y="0.5" width="1199" height="63" rx="20"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="64" fill="#0b0b10"/>
    <!-- Continue the header's glow at its 360px lower edge. -->
    <g transform="translate(0 -360)">
      <g filter="url(#blur)">
        <ellipse cx="1020" cy="70" rx="240" ry="150" fill="#a855f7" fill-opacity="0.22"/>
        <ellipse cx="1100" cy="320" rx="220" ry="120" fill="#f97316" fill-opacity="0.15"/>
        <ellipse cx="720" cy="360" rx="180" ry="100" fill="#22d3ee" fill-opacity="0.08"/>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="63" rx="20" stroke="#1f1f29"/>
  <text x="56" y="39" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.9" fill="#a1a1aa">PROFILE VIEWS</text>
  <text x="205" y="41" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#f4f4f5">1,015</text>
  <text x="1144" y="39" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#a1a1aa">Updated daily</text>
</svg>
